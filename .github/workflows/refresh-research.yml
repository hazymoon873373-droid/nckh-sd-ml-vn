name: Refresh HOSE Market Data & Q1 Research Pipeline

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy and Pandas
        run: pip install numpy pandas
      - name: Re-fetch Yahoo Finance .VN and re-run Walk-Forward Pipeline
        run: |
          cd web_demo
          python research_pipeline.py
      - name: Commit refreshed docs/data JSONs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/research_bundle.json docs/data/market_panel.json
          git diff --staged --quiet || (git commit -m "chore: refresh HOSE 5y Yahoo data and ML-ASSD bundle" && git push)
